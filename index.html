<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Order of the Significant P</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080608;
  --surface: #110e14;
  --surface2: #1a1520;
  --border: #2e2438;
  --border-bright: #4a3860;
  --ember: #e8621a;
  --ember-dim: #7a2f08;
  --gold: #d4a820;
  --gold-dim: #6b5010;
  --gold-bright: #f5c842;
  --rune: #8b5cf6;
  --rune-bright: #a78bfa;
  --blood: #c0182c;
  --blood-dim: #5a0a14;
  --sage: #1a7a4a;
  --sage-bright: #2dd474;
  --text: #e8ddd0;
  --text-dim: #9b8fa0;
  --text-muted: #5a4f60;
  --hp-full: #2dd474;
  --hp-mid: #f5c842;
  --hp-low: #e8621a;
  --hp-crit: #c0182c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  min-height: 100vh;
  font-family: 'Crimson Pro', serif;
  color: var(--text);
  overflow-x: hidden;
  cursor: default;
}

#bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(139,92,246,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 0% 100%, rgba(232,98,26,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 30% 50% at 100% 50%, rgba(212,168,32,0.04) 0%, transparent 60%);
}

.ember-particle {
  position: fixed; pointer-events: none; z-index: 0;
  width: 2px; height: 2px; border-radius: 50%;
  background: var(--ember);
  animation: rise linear infinite;
  opacity: 0;
}
@keyframes rise {
  0% { transform: translateY(100vh) translateX(0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-20px) translateX(var(--drift)); opacity: 0; }
}

#app {
  position: relative; z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

#hud {
  display: none;
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,6,8,0.92);
  border-bottom: 1px solid var(--border-bright);
  backdrop-filter: blur(12px);
  padding: 10px 16px;
  margin: 0 -16px 24px;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
#hud.visible { display: flex; }

.hud-class {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--rune-bright);
  text-transform: uppercase;
  white-space: nowrap;
}
.hud-class span { color: var(--text-dim); }

.hp-block { flex: 1; min-width: 140px; }
.hp-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 4px;
  display: flex; justify-content: space-between;
}
.hp-label span { color: var(--text); font-size: 0.75rem; }
.hp-track {
  height: 8px; background: var(--surface2);
  border-radius: 4px; overflow: hidden;
  border: 1px solid var(--border);
}
.hp-fill {
  height: 100%; border-radius: 4px;
  background: var(--hp-full);
  transition: width 0.4s ease, background 0.4s ease;
  position: relative;
}
.hp-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.15));
  border-radius: 4px;
}

.xp-block { flex: 1; min-width: 140px; }
.xp-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem; letter-spacing: 0.1em;
  color: var(--text-muted); text-transform: uppercase;
  margin-bottom: 4px;
  display: flex; justify-content: space-between;
}
.xp-label span { color: var(--gold); font-size: 0.75rem; }
.xp-track {
  height: 8px; background: var(--surface2);
  border-radius: 4px; overflow: hidden; border: 1px solid var(--border);
}
.xp-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.5s ease;
}

.hud-quest {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.08em; color: var(--gold-bright);
  text-transform: uppercase; white-space: nowrap;
}

#title-screen {
  text-align: center;
  padding: 40px 0 20px;
  animation: fadeUp 1.2s ease;
}

.title-sigil {
  font-size: 5rem; line-height: 1;
  margin-bottom: 1rem;
  animation: pulseGlow 3s ease-in-out infinite;
  display: block;
}
@keyframes pulseGlow {
  0%,100% { filter: drop-shadow(0 0 10px rgba(139,92,246,0.4)) drop-shadow(0 0 30px rgba(232,98,26,0.2)); }
  50% { filter: drop-shadow(0 0 20px rgba(139,92,246,0.7)) drop-shadow(0 0 50px rgba(232,98,26,0.4)); }
}

h1.game-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  font-weight: 900;
  color: transparent;
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--ember) 50%, var(--rune-bright) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  line-height: 1.2;
  margin-bottom: 0.5rem;
  text-shadow: none;
  letter-spacing: 0.02em;
}

.title-sub {
  font-family: 'Cinzel', serif;
  font-size: clamp(0.75rem, 2vw, 0.9rem);
  color: var(--text-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 2.5rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(139,92,246,0.04) 0%, transparent 50%, rgba(212,168,32,0.03) 100%);
  pointer-events: none;
}

.card-rune-tl, .card-rune-br {
  position: absolute;
  font-size: 1rem; opacity: 0.2; color: var(--rune);
}
.card-rune-tl { top: 10px; left: 14px; }
.card-rune-br { bottom: 10px; right: 14px; }

.class-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 1.5rem;
}
@media(max-width:520px){ .class-grid { grid-template-columns: 1fr; } }

.class-card {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 1.4rem 1rem;
  cursor: pointer;
  text-align: center;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.class-card::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--class-color, rgba(139,92,246,0.15)) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.class-card:hover { border-color: var(--class-color, var(--rune)); transform: translateY(-4px); }
.class-card:hover::after { opacity: 1; }

.class-icon { font-size: 2.4rem; display: block; margin-bottom: 0.6rem; }
.class-name {
  font-family: 'Cinzel', serif;
  font-size: 0.85rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold-bright);
  margin-bottom: 0.4rem;
}
.class-perk {
  font-size: 0.82rem; color: var(--text-dim);
  font-style: italic; line-height: 1.5;
}
.class-hp {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  color: var(--hp-full); margin-top: 0.5rem;
  letter-spacing: 0.08em;
}

.scene-wrap { animation: fadeUp 0.4s ease; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

.scene-header {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 1.5rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border-bright);
}
.scene-icon-lg { font-size: 2.8rem; flex-shrink: 0; line-height: 1; }
.scene-chapter {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ember); margin-bottom: 0.3rem;
}
.scene-title {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  font-weight: 700; color: var(--gold-bright);
  line-height: 1.2;
}

.narrative {
  font-size: clamp(0.95rem, 2vw, 1.08rem);
  line-height: 1.9; color: var(--text);
  margin-bottom: 1.4rem;
}
.narrative p { margin-bottom: 0.9rem; }
.narrative p:last-child { margin-bottom: 0; }
.narrative em { color: var(--gold); font-style: italic; }
.narrative strong { color: var(--gold-bright); font-style: normal; }

.npc-speech {
  border-left: 3px solid var(--rune);
  padding: 0.7rem 1rem;
  margin: 0.8rem 0;
  background: rgba(139,92,246,0.06);
  border-radius: 0 4px 4px 0;
  font-style: italic;
  color: var(--rune-bright);
  font-size: 0.97rem;
}

.highlight { color: var(--ember); font-weight: 600; }
.term { color: var(--sage-bright); font-style: italic; font-weight: 600; }

.box {
  border-radius: 4px; padding: 1rem 1.2rem;
  margin: 1.2rem 0; font-size: 0.9rem;
  line-height: 1.75; position: relative;
}
.box-title {
  font-family: 'Cinzel', serif; font-size: 0.68rem;
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 0.5rem; display: block;
}
.box-lore {
  background: rgba(139,92,246,0.07);
  border: 1px solid rgba(139,92,246,0.25);
  border-left: 3px solid var(--rune);
  color: var(--text);
}
.box-lore .box-title { color: var(--rune-bright); }

.box-danger {
  background: rgba(192,24,44,0.08);
  border: 1px solid rgba(192,24,44,0.3);
  border-left: 3px solid var(--blood);
  color: var(--text);
}
.box-danger .box-title { color: var(--blood); }

.box-victory {
  background: rgba(45,212,116,0.07);
  border: 1px solid rgba(45,212,116,0.25);
  border-left: 3px solid var(--sage-bright);
  color: var(--text);
}
.box-victory .box-title { color: var(--sage-bright); }

.box-gold {
  background: rgba(212,168,32,0.08);
  border: 1px solid rgba(212,168,32,0.3);
  border-left: 3px solid var(--gold);
  color: var(--text);
}
.box-gold .box-title { color: var(--gold-bright); }

.hint-box {
  background: rgba(139,92,246,0.12);
  border: 1px dashed var(--rune);
  border-radius: 4px;
  padding: 0.8rem 1rem;
  margin: 1rem 0;
  font-size: 0.85rem;
  color: var(--rune-bright);
  display: none;
}
.hint-box.show { display: block; }
.hint-box .hint-label {
  font-family: 'Cinzel', serif; font-size: 0.62rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--rune); margin-bottom: 0.3rem; display: block;
}

.data-table {
  width: 100%; border-collapse: collapse;
  margin: 1rem 0; font-size: 0.87rem;
}
.data-table th {
  background: rgba(139,92,246,0.15);
  color: var(--rune-bright);
  font-family: 'Cinzel', serif; font-size: 0.68rem;
  letter-spacing: 0.08em; padding: 0.5rem 0.8rem;
  text-align: left; border-bottom: 1px solid var(--rune);
}
.data-table td {
  border: 1px solid var(--border);
  padding: 0.4rem 0.8rem;
  color: var(--text);
}
.data-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

.choices-wrap { margin-top: 1.5rem; }
.choices-label {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 0.8rem;
}
.choices { display: flex; flex-direction: column; gap: 8px; }

.choice-btn {
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 4px;
  padding: 0.9rem 1.1rem 0.9rem 2.8rem;
  font-family: 'Crimson Pro', serif;
  font-size: clamp(0.9rem, 2vw, 1.02rem);
  color: var(--text); cursor: pointer;
  text-align: left; transition: all 0.2s ease;
  position: relative; line-height: 1.55;
}
.choice-btn::before {
  content: '◆';
  position: absolute; left: 1rem; top: 50%;
  transform: translateY(-50%);
  color: var(--border-bright);
  font-size: 0.6rem;
  transition: all 0.2s;
}
.choice-btn:hover {
  background: rgba(139,92,246,0.1);
  border-color: var(--rune);
  color: var(--gold-bright);
  transform: translateX(4px);
}
.choice-btn:hover::before { color: var(--rune-bright); transform: translateY(-50%) scale(1.4); }
.choice-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

#boss-screen { display: none; }
#boss-screen.active { display: block; }

.boss-arena {
  border: 2px solid var(--blood);
  border-radius: 8px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, rgba(192,24,44,0.12) 0%, transparent 60%);
  position: relative;
}

.boss-header {
  background: linear-gradient(90deg, var(--blood-dim), rgba(90,10,20,0.4));
  padding: 1rem 1.5rem;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--blood);
}
.boss-icon { font-size: 2.5rem; animation: bossFloat 2s ease-in-out infinite; }
@keyframes bossFloat {
  0%,100%{ transform: translateY(0) rotate(-2deg); }
  50%{ transform: translateY(-6px) rotate(2deg); }
}
.boss-name {
  font-family: 'Cinzel', serif; font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 700; color: var(--blood);
  text-shadow: 0 0 20px rgba(192,24,44,0.5);
}
.boss-sub { font-size: 0.82rem; color: var(--text-dim); font-style: italic; margin-top: 0.2rem; }

.boss-hp-block { margin-left: auto; text-align: right; min-width: 120px; }
.boss-hp-label {
  font-family: 'Cinzel', serif; font-size: 0.6rem;
  letter-spacing: 0.1em; color: var(--blood); text-transform: uppercase;
  margin-bottom: 3px;
}
.boss-hp-track {
  height: 10px; background: rgba(0,0,0,0.5);
  border-radius: 5px; overflow: hidden;
  border: 1px solid var(--blood-dim);
}
.boss-hp-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, var(--blood-dim), var(--blood));
  transition: width 0.5s ease;
  box-shadow: 0 0 8px rgba(192,24,44,0.5);
}

.boss-timer-wrap {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 0.8rem 1.5rem;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
}
.boss-timer {
  font-family: 'Cinzel', serif; font-size: 1.8rem;
  font-weight: 700; color: var(--gold-bright);
  min-width: 3ch; text-align: center;
  transition: color 0.3s;
}
.boss-timer.urgent { color: var(--blood); animation: timerPulse 0.5s ease-in-out infinite; }
@keyframes timerPulse { 0%,100%{ opacity: 1; } 50%{ opacity: 0.5; } }
.timer-label {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  color: var(--text-muted); letter-spacing: 0.1em;
  text-transform: uppercase;
}

.boss-body { padding: 1.5rem; }

.phase-indicator {
  display: flex; gap: 6px; margin-bottom: 1.2rem;
  align-items: center;
}
.phase-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border-bright);
  transition: all 0.3s;
}
.phase-dot.done { background: var(--sage-bright); box-shadow: 0 0 6px rgba(45,212,116,0.5); }
.phase-dot.active {
  background: var(--ember);
  box-shadow: 0 0 8px rgba(232,98,26,0.7);
  animation: phasePulse 1s ease-in-out infinite;
}
@keyframes phasePulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.4); } }
.phase-label {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  color: var(--ember); letter-spacing: 0.1em;
  text-transform: uppercase; margin-left: 4px;
}

.boss-narrative {
  font-size: clamp(0.92rem, 2vw, 1.05rem);
  line-height: 1.85; color: var(--text);
  margin-bottom: 1.2rem;
}
.boss-narrative p { margin-bottom: 0.8rem; }

.boss-choices { display: flex; flex-direction: column; gap: 8px; }
.boss-choice {
  background: rgba(192,24,44,0.06);
  border: 1px solid var(--blood-dim);
  border-radius: 4px;
  padding: 0.85rem 1rem 0.85rem 2.6rem;
  font-family: 'Crimson Pro', serif;
  font-size: clamp(0.88rem, 2vw, 1rem);
  color: var(--text); cursor: pointer;
  text-align: left; transition: all 0.2s;
  position: relative; line-height: 1.5;
}
.boss-choice::before {
  content: '⚔';
  position: absolute; left: 0.8rem; top: 50%;
  transform: translateY(-50%);
  font-size: 0.75rem; color: var(--blood-dim);
  transition: all 0.2s;
}
.boss-choice:hover {
  background: rgba(192,24,44,0.15);
  border-color: var(--blood);
  color: var(--gold-bright);
  transform: translateX(3px);
}
.boss-choice:hover::before { color: var(--blood); }
.boss-choice:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

.attack-flash {
  position: fixed; inset: 0; z-index: 999;
  pointer-events: none; opacity: 0;
  background: var(--flash-color, rgba(192,24,44,0.4));
  animation: flashAnim 0.5s ease forwards;
}
@keyframes flashAnim {
  0%{ opacity: 0.6; }
  100%{ opacity: 0; }
}

@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-8px); }
  40%{ transform: translateX(8px); }
  60%{ transform: translateX(-5px); }
  80%{ transform: translateX(5px); }
}
.shake { animation: shake 0.4s ease; }

.quest-map {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px; margin-top: 1.2rem;
}
@media(max-width:480px){ .quest-map { grid-template-columns: 1fr; } }

.quest-node {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 6px; padding: 1.2rem;
  cursor: pointer; text-align: center;
  transition: all 0.25s ease; position: relative;
  overflow: hidden;
}
.quest-node::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, var(--node-color, rgba(139,92,246,0.12)) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.3s;
}
.quest-node:hover:not(.locked) { border-color: var(--gold); transform: translateY(-3px); }
.quest-node:hover:not(.locked)::before { opacity: 1; }

.quest-node.suggested {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(212,168,32,0.25);
}
.quest-node.suggested .node-level {
  color: var(--gold-bright);
}

.quest-node.locked { opacity: 0.4; cursor: not-allowed; }
.quest-node.completed { border-color: var(--sage); }
.quest-node.completed::after {
  content: '✓';
  position: absolute; top: 8px; right: 10px;
  color: var(--sage-bright); font-size: 1rem;
}

.node-icon { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
.node-chapter {
  font-family: 'Cinzel', serif; font-size: 0.6rem;
  letter-spacing: 0.12em; color: var(--text-muted);
  text-transform: uppercase; margin-bottom: 0.3rem;
}
.node-name {
  font-family: 'Cinzel', serif; font-size: 0.82rem;
  color: var(--gold-bright); font-weight: 700;
  margin-bottom: 0.25rem;
}
.node-desc { font-size: 0.82rem; color: var(--text-dim); font-style: italic; }
.node-level {
  font-family: 'Cinzel', serif; font-size: 0.65rem;
  color: var(--rune-bright); margin-top: 0.5rem;
  letter-spacing: 0.08em;
}

.death-screen {
  text-align: center; padding: 2rem 1rem;
}
.death-icon { font-size: 4rem; display: block; margin-bottom: 1rem; animation: deathSpin 3s linear infinite; }
@keyframes deathSpin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.death-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.4rem, 4vw, 2rem);
  color: var(--blood);
  text-shadow: 0 0 30px rgba(192,24,44,0.6);
  margin-bottom: 0.5rem;
}
.death-sub {
  font-family: 'Cinzel', serif; font-size: 0.8rem;
  letter-spacing: 0.15em; color: var(--text-dim);
  text-transform: uppercase; margin-bottom: 1.5rem;
}

.levelup-screen {
  text-align: center; padding: 2rem 1rem;
  animation: levelUpAnim 0.6s ease;
}
@keyframes levelUpAnim {
  0%{ transform: scale(0.8); opacity: 0; }
  60%{ transform: scale(1.05); }
  100%{ transform: scale(1); opacity: 1; }
}
.levelup-icon { font-size: 4rem; display: block; margin-bottom: 0.8rem; }
.levelup-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.3rem, 4vw, 2rem);
  color: var(--gold-bright);
  text-shadow: 0 0 30px rgba(212,168,32,0.6);
  margin-bottom: 0.5rem;
}

.btn {
  font-family: 'Cinzel', serif;
  font-size: 0.78rem; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 0.7rem 1.6rem;
  border-radius: 4px; cursor: pointer;
  transition: all 0.2s ease; border: none;
  display: inline-block;
}
.btn-primary {
  background: linear-gradient(135deg, var(--ember-dim), var(--ember));
  color: var(--text);
  box-shadow: 0 4px 15px rgba(232,98,26,0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(232,98,26,0.5);
}
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-bright);
  color: var(--text-dim);
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn-gold {
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  color: var(--bg);
}
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,168,32,0.4); }

.rune-divider {
  text-align: center; color: var(--rune);
  opacity: 0.3; letter-spacing: 0.5em;
  font-size: 0.8rem; margin: 1.5rem 0;
}

.quest-complete-banner {
  text-align: center; padding: 1.5rem;
  background: radial-gradient(ellipse at 50% 0%, rgba(45,212,116,0.1) 0%, transparent 70%);
  border: 1px solid var(--sage);
  border-radius: 6px; margin-bottom: 1rem;
}
.quest-complete-banner .qc-icon { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
.quest-complete-banner .qc-title {
  font-family: 'Cinzel', serif; font-size: clamp(1rem, 3vw, 1.3rem);
  color: var(--sage-bright); margin-bottom: 0.3rem;
}
.quest-complete-banner .qc-xp {
  font-family: 'Cinzel', serif; font-size: 0.8rem;
  color: var(--gold); letter-spacing: 0.1em;
}

/* ── Treasure Chest ─────────────────────────────────── */
.treasure-chest {
  display: inline-block; cursor: pointer;
  padding: 0.8rem 1.4rem;
  background: linear-gradient(135deg, rgba(212,168,32,0.15) 0%, rgba(139,92,246,0.08) 100%);
  border: 1px solid var(--gold-dim); border-radius: 8px;
  font-family: 'Cinzel', serif; font-size: 0.8rem;
  color: var(--gold); letter-spacing: 0.08em; text-align: center;
  transition: all 0.25s ease; user-select: none;
}
.treasure-chest:hover {
  border-color: var(--gold-bright); color: var(--gold-bright);
  background: linear-gradient(135deg, rgba(212,168,32,0.22) 0%, rgba(139,92,246,0.12) 100%);
  transform: translateY(-2px); box-shadow: 0 4px 20px rgba(212,168,32,0.2);
}
.treasure-chest .chest-icon { font-size: 1.8rem; display: block; margin-bottom: 0.4rem; transition: transform 0.3s ease; }
.treasure-chest:hover .chest-icon { transform: translateY(-4px) rotate(-5deg); }
.treasure-chest.opened .chest-icon::after { content: ' ✦'; font-size: 0.7rem; }
.treasure-reveal {
  display: none; margin-top: 1rem; padding: 1rem 1.2rem;
  background: linear-gradient(135deg, rgba(212,168,32,0.1) 0%, rgba(139,92,246,0.06) 100%);
  border: 1px solid var(--gold-dim); border-radius: 6px;
  animation: chestOpen 0.4s ease;
}
.treasure-reveal.visible { display: block; }
@keyframes chestOpen {
  0% { opacity: 0; transform: translateY(-8px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.treasure-song-title { font-family: 'Cinzel Decorative', serif; font-size: 0.95rem; color: var(--gold-bright); margin-bottom: 0.25rem; }
.treasure-song-artist { font-family: 'Crimson Pro', serif; font-style: italic; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 0.6rem; }
.treasure-song-note { font-family: 'Crimson Pro', serif; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem; line-height: 1.5; }
.treasure-link-row { display: flex; gap: 8px; flex-wrap: wrap; }
.treasure-listen-btn {
  display: inline-block; padding: 0.4rem 1rem;
  border: 1px solid var(--gold); border-radius: 4px;
  font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.07em;
  text-decoration: none; transition: all 0.2s;
}
.treasure-listen-btn.bc { background: rgba(26,99,138,0.18); color: #1da0c3; border-color: #1da0c3; }
.treasure-listen-btn.bc:hover { background: rgba(26,99,138,0.35); color: #fff; }
.treasure-track-list { display: flex; flex-direction: column; gap: 6px; margin: 0.4rem 0; text-align: left; }
.treasure-track-link {
  display: block; padding: 0.35rem 0.7rem;
  background: rgba(26,99,138,0.1); border: 1px solid rgba(26,99,138,0.3); border-radius: 4px;
  color: #1da0c3; font-family: 'Crimson Pro', serif; font-size: 0.9rem;
  text-decoration: none; transition: all 0.18s;
}
.treasure-track-link:hover { background: rgba(26,99,138,0.25); color: #fff; border-color: #1da0c3; padding-left: 1rem; }

.scroll-item {
  opacity: 0; transform: translateY(12px);
  animation: scrollReveal 0.4s ease forwards;
}
@keyframes scrollReveal {
  to { opacity: 1; transform: translateY(0); }
}

.dmg-number {
  position: fixed;
  font-family: 'Cinzel', serif; font-size: 1.8rem;
  font-weight: 700; pointer-events: none; z-index: 1000;
  animation: dmgFloat 1.2s ease forwards;
}
@keyframes dmgFloat {
  0%{ transform: translateY(0); opacity: 1; }
  100%{ transform: translateY(-70px); opacity: 0; }
}

@media(max-width:600px){
  .card { padding: 1.2rem; }
  .boss-body { padding: 1rem; }
}

/* ══════════════════════════════════════════════════════
   JAMOVI OUTPUT STYLING
══════════════════════════════════════════════════════ */
.jmv-output {
  background: #1a1a2e;
  border: 1px solid var(--border-bright);
  border-radius: 4px;
  padding: 0.8rem 1rem;
  margin: 0.8rem 0;
  font-family: 'Crimson Pro', serif;
}
.jmv-title {
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--rune-bright);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--border-bright);
}
.jmv-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
.jmv-table th {
  text-align: right;
  padding: 0.25rem 0.7rem;
  color: var(--text-dim);
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  letter-spacing: 0.05em;
  border-bottom: 2px solid var(--border-bright);
  font-weight: 600;
}
.jmv-table th:first-child { text-align: left; }
.jmv-table td {
  text-align: right;
  padding: 0.25rem 0.7rem;
  color: var(--text);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.jmv-table .jmv-row-label {
  text-align: left;
  color: var(--text-dim);
  font-style: italic;
}
.jmv-table tr:last-child td { border-bottom: 2px solid var(--border-bright); }
.jmv-note {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 0.4rem;
  font-style: italic;
}
.sig { color: var(--sage-bright); font-weight: 600; }
.nonsig { color: var(--text-dim); }


.hud-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-left: auto;
  flex-shrink: 0;
}
.hud-btn {
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-dim);
  transition: all 0.2s;
  white-space: nowrap;
}
.hud-btn:hover { border-color: var(--gold); color: var(--gold); }
.hud-btn.danger:hover { border-color: var(--blood); color: var(--blood); }
.hud-btn.save-on {
  border-color: var(--sage-bright);
  color: var(--sage-bright);
}
.hud-save-tooltip {
  position: fixed;
  top: 52px;
  right: 16px;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 0.78rem;
  color: var(--text);
  z-index: 200;
  max-width: 220px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  display: none;
}
.hud-save-tooltip.show { display: block; animation: fadeIn 0.15s ease; }


/* ══════════════════════════════════════════════════════
   THE ORACLE — Spirit Guide Panel
══════════════════════════════════════════════════════ */
#oracle-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 300;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, var(--rune-bright), #4a1a8a);
  border: 2px solid var(--gold);
  box-shadow: 0 0 18px rgba(139,92,246,0.5), 0 2px 8px rgba(0,0,0,0.5);
  cursor: pointer;
  font-size: 1.4rem;
  display: none;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, box-shadow 0.2s;
}
#oracle-toggle:hover {
  transform: scale(1.1);
  box-shadow: 0 0 28px rgba(139,92,246,0.7), 0 2px 8px rgba(0,0,0,0.5);
}
#oracle-toggle.visible { display: flex; }

#oracle-panel {
  position: fixed;
  bottom: 82px;
  right: 20px;
  z-index: 299;
  width: 310px;
  max-height: 70vh;
  overflow-y: auto;
  background: rgba(12, 8, 18, 0.97);
  border: 1px solid var(--gold);
  border-radius: 8px;
  box-shadow: 0 0 30px rgba(139,92,246,0.3), 0 8px 32px rgba(0,0,0,0.6);
  display: none;
  flex-direction: column;
  animation: slideUp 0.2s ease;
}
#oracle-panel.open { display: flex; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.oracle-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border-bright);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.oracle-avatar {
  font-size: 1.5rem;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, rgba(139,92,246,0.3), transparent);
  border-radius: 50%;
  flex-shrink: 0;
}
.oracle-name {
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: var(--gold-bright);
  text-transform: uppercase;
}
.oracle-title {
  font-family: 'Crimson Pro', serif;
  font-size: 0.78rem;
  color: var(--text-muted);
  font-style: italic;
}

.oracle-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.oracle-tab {
  flex: 1;
  padding: 7px 4px;
  font-family: 'Cinzel', serif;
  font-size: 0.55rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  text-align: center;
}
.oracle-tab:hover { color: var(--text-dim); }
.oracle-tab.active {
  color: var(--gold-bright);
  border-bottom-color: var(--gold);
}

.oracle-body {
  padding: 12px 14px;
  font-family: 'Crimson Pro', serif;
  font-size: 0.88rem;
  line-height: 1.65;
  color: var(--text-dim);
  flex: 1;
}
.oracle-body h4 {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  color: var(--rune-bright);
  text-transform: uppercase;
  margin: 10px 0 5px;
}
.oracle-body h4:first-child { margin-top: 0; }
.oracle-tip {
  background: rgba(139,92,246,0.08);
  border-left: 2px solid var(--rune);
  padding: 6px 8px;
  margin: 6px 0;
  border-radius: 0 3px 3px 0;
  font-size: 0.84rem;
}
.oracle-tip.gold {
  background: rgba(212,168,32,0.08);
  border-left-color: var(--gold);
}
.oracle-tip.danger {
  background: rgba(200,40,40,0.08);
  border-left-color: var(--blood);
}


/* ══════════════════════════════════════════════════════
   VISUAL NOVEL ENGINE — Dark Fantasy Style
══════════════════════════════════════════════════════ */

/* ── VN Stage ───────────────────────────────────────── */
#vn-stage {
  display: none;
  flex-direction: column;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  overflow: hidden;
}
#vn-stage.active { display: flex; }

/* ── Scene Background ───────────────────────────────── */
#vn-bg {
  position: absolute;
  inset: 0;
  transition: opacity 0.6s ease;
}
.vn-bg-archive {
  background:
    radial-gradient(ellipse 80% 60% at 50% 110%, rgba(80,40,10,0.9) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 20% 20%, rgba(139,92,246,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 30% 50% at 80% 10%, rgba(212,168,32,0.08) 0%, transparent 60%),
    linear-gradient(180deg, #0a0610 0%, #120c18 40%, #1a1010 100%);
}
.vn-bg-lobby {
  background:
    radial-gradient(ellipse 60% 50% at 50% 100%, rgba(180,120,20,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 30% 40% at 15% 60%, rgba(180,100,10,0.2) 0%, transparent 50%),
    radial-gradient(ellipse 30% 40% at 85% 60%, rgba(180,100,10,0.2) 0%, transparent 50%),
    linear-gradient(180deg, #06080e 0%, #0e0c08 60%, #18110a 100%);
}
.vn-bg-banquet {
  background:
    radial-gradient(ellipse 100% 30% at 50% 100%, rgba(160,80,10,0.4) 0%, transparent 50%),
    radial-gradient(ellipse 20% 60% at 50% 10%, rgba(212,168,32,0.15) 0%, transparent 60%),
    linear-gradient(180deg, #080608 0%, #100c06 50%, #180e08 100%);
}
.vn-bg-cellar {
  background:
    radial-gradient(ellipse 50% 40% at 50% 90%, rgba(120,20,20,0.4) 0%, transparent 55%),
    radial-gradient(ellipse 20% 30% at 20% 50%, rgba(180,60,10,0.15) 0%, transparent 40%),
    radial-gradient(ellipse 20% 30% at 80% 50%, rgba(180,60,10,0.15) 0%, transparent 40%),
    linear-gradient(180deg, #060408 0%, #0e0608 60%, #160808 100%);
}
.vn-bg-spa {
  background:
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(20,80,120,0.35) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 50% 20%, rgba(100,180,220,0.08) 0%, transparent 60%),
    linear-gradient(180deg, #04080e 0%, #060c14 50%, #081018 100%);
}
.vn-bg-castle {
  background:
    radial-gradient(ellipse 100% 40% at 50% 100%, rgba(60,10,80,0.5) 0%, transparent 50%),
    radial-gradient(ellipse 30% 60% at 50% 0%, rgba(139,92,246,0.15) 0%, transparent 60%),
    linear-gradient(180deg, #04020a 0%, #080412 50%, #100820 100%);
}
.vn-bg-boss {
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(160,10,30,0.25) 0%, transparent 60%),
    radial-gradient(ellipse 40% 80% at 50% 0%, rgba(80,0,10,0.4) 0%, transparent 60%),
    linear-gradient(180deg, #08020a 0%, #100308 50%, #06020a 100%);
  animation: bossFlicker 4s ease-in-out infinite alternate;
}
@keyframes bossFlicker {
  0%   { filter: brightness(1); }
  50%  { filter: brightness(0.85); }
  100% { filter: brightness(1.05); }
}

/* ── Background decoration layers ───────────────────── */
#vn-bg-deco {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

/* Archive: bookshelf silhouettes */
.vn-bg-archive #vn-bg-deco::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 45%;
  background:
    repeating-linear-gradient(90deg,
      transparent 0px, transparent 28px,
      rgba(20,12,28,0.9) 28px, rgba(20,12,28,0.9) 32px
    ),
    linear-gradient(180deg, transparent 0%, rgba(15,8,20,0.95) 100%);
  clip-path: polygon(
    0% 100%, 0% 30%, 5% 30%, 5% 0%, 8% 0%, 8% 20%, 12% 20%, 12% 5%,
    18% 5%, 18% 25%, 22% 25%, 22% 10%, 28% 10%, 28% 0%, 32% 0%,
    32% 15%, 38% 15%, 38% 5%, 44% 5%, 44% 20%, 50% 20%, 50% 8%,
    56% 8%, 56% 0%, 62% 0%, 62% 18%, 68% 18%, 68% 5%, 74% 5%,
    74% 25%, 80% 25%, 80% 12%, 86% 12%, 86% 0%, 92% 0%, 92% 22%,
    96% 22%, 96% 30%, 100% 30%, 100% 100%
  );
}

/* Lobby: floor glow */
.vn-bg-lobby #vn-bg-deco::after {
  content: '';
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 35%;
  background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(212,168,32,0.12) 0%, transparent 70%);
  border-radius: 50%;
}

/* Cellar: stone arch */
.vn-bg-cellar #vn-bg-deco::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 55%;
  background: transparent;
  border-bottom: 4px solid rgba(80,40,30,0.3);
  border-radius: 0 0 50% 50% / 0 0 30% 30%;
  box-shadow: 0 0 60px rgba(180,60,10,0.1);
}

/* Castle: distant towers */
.vn-bg-castle #vn-bg-deco::before {
  content: '';
  position: absolute;
  bottom: 30%; left: 0; right: 0;
  height: 40%;
  background: 
    linear-gradient(180deg, transparent 60%, rgba(4,2,10,0.8) 100%);
  clip-path: polygon(
    0% 100%, 0% 60%, 8% 60%, 8% 40%, 10% 40%, 10% 20%, 12% 20%,
    12% 40%, 14% 40%, 14% 60%, 22% 60%, 22% 50%, 24% 50%, 24% 30%,
    26% 30%, 26% 10%, 28% 10%, 28% 30%, 30% 30%, 30% 50%, 32% 50%,
    32% 60%, 40% 60%, 40% 45%, 48% 45%, 48% 25%, 50% 25%, 50% 5%,
    52% 5%, 52% 25%, 54% 25%, 54% 45%, 62% 45%, 62% 60%,
    68% 60%, 68% 50%, 72% 50%, 72% 35%, 74% 35%, 74% 15%,
    76% 15%, 76% 35%, 78% 35%, 78% 50%, 82% 50%, 82% 60%,
    90% 60%, 90% 40%, 92% 40%, 92% 55%, 100% 55%, 100% 100%
  );
}

/* ── Character Layer ─────────────────────────────────── */
#vn-chars {
  position: absolute;
  inset: 0;
  bottom: 38%;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 4%;
}

.vn-char {
  position: relative;
  display: flex;
  align-items: flex-end;
  transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
  transform-origin: bottom center;
}
.vn-char.hidden { opacity: 0; transform: translateY(20px); }
.vn-char.dim { opacity: 0.35; filter: brightness(0.5) saturate(0.4); }
.vn-char.active {
  filter: drop-shadow(0 0 20px rgba(212,168,32,0.25));
  transform: scale(1.03);
}
.vn-char.speaking {
  animation: charBob 2s ease-in-out infinite;
}
@keyframes charBob {
  0%,100% { transform: scale(1.03) translateY(0); }
  50%      { transform: scale(1.03) translateY(-4px); }
}
.vn-char svg { display: block; }

/* ── Dialogue Box ────────────────────────────────────── */
#vn-dialogue {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, rgba(8,4,12,0.92) 0%, rgba(12,6,18,0.98) 100%);
  border-top: 1px solid var(--border-bright);
  backdrop-filter: blur(8px);
  padding: 0;
  min-height: 38%;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  user-select: none;
}

#vn-namebox {
  display: inline-block;
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold-bright);
  background: linear-gradient(90deg, rgba(212,168,32,0.18), transparent);
  border-left: 3px solid var(--gold);
  padding: 6px 14px 5px;
  margin: 0;
}

#vn-text-area {
  flex: 1;
  padding: 10px 18px 6px;
  font-family: 'Crimson Pro', serif;
  font-size: 1.05rem;
  line-height: 1.7;
  color: var(--text);
  min-height: 80px;
}

#vn-tap-hint {
  font-family: 'Cinzel', serif;
  font-size: 0.52rem;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  text-align: right;
  padding: 2px 14px 8px;
  text-transform: uppercase;
  animation: tapPulse 1.5s ease-in-out infinite;
}
@keyframes tapPulse {
  0%,100% { opacity: 0.4; }
  50%      { opacity: 1; }
}

/* ── Lore/Info boxes inside dialogue ─────────────────── */
#vn-text-area .vn-lore {
  background: rgba(139,92,246,0.1);
  border: 1px solid rgba(139,92,246,0.3);
  border-radius: 4px;
  padding: 8px 12px;
  margin: 8px 0;
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--text-dim);
}

// ══════════════════════════════════════════════════════
// QUEST UNLOCK LOGIC (FIX 2)
// A quest is unlocked if:
//   - it's quest 1 (always available), OR
//   - the previous quest in QUEST_ORDER has been completed
// This replaces the brittle XP-level gate that could fail
// if a player took damage and missed XP pickups.
// ══════════════════════════════════════════════════════
function isQuestLocked(questId) {
  const idx = QUEST_ORDER.indexOf(questId);
  if (idx === 0) return false; // Quest 1 always available
  const prevQuestId = QUEST_ORDER[idx - 1];
  return !G.questsDone.includes(prevQuestId);
}

function makePieChart({ title, slices, annotation = '' }) {
  const W = 180, CX = 90, CY = 80, R = 62;
  const colors = ['var(--ember)', 'var(--rune-bright)', 'var(--gold)', 'var(--sage-bright)', 'var(--blood)'];
  const total = slices.reduce((a, s) => a + s.value, 0);
  let angle = -Math.PI / 2;
  const paths = slices.map((s, i) => {
    const sweep = (s.value / total) * 2 * Math.PI;
    const x1 = CX + R * Math.cos(angle), y1 = CY + R * Math.sin(angle);
    angle += sweep;
    const x2 = CX + R * Math.cos(angle), y2 = CY + R * Math.sin(angle);
    const large = sweep > Math.PI ? 1 : 0;
    const midA = angle - sweep / 2;
    const lx = CX + (R * 0.65) * Math.cos(midA), ly = CY + (R * 0.65) * Math.sin(midA);
    return `<path d="M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[i]}" opacity="0.82" stroke="var(--bg)" stroke-width="1.5"/>
    <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle" font-size="8" fill="var(--bg)" font-family="Cinzel,serif" font-weight="700">${s.label}</text>`;
  }).join('');
  const ann = annotation ? `<text x="${W/2}" y="${CY + R + 16}" text-anchor="middle" font-size="9" fill="var(--ember)" font-family="Crimson Pro,serif" font-style="italic">${annotation}</text>` : '';
  return `<div style="text-align:center; margin:0.6rem 0; display:inline-block; vertical-align:top">
    <div style="font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px">${title}</div>
    <svg viewBox="0 0 ${W} ${CY + R + 22}" width="${W}" style="max-width:100%; display:block; margin:0 auto; background:var(--surface2); border-radius:4px; border:1px solid var(--border)">
      ${paths}${ann}
    </svg></div>`;
}

function makeCIPlot({ title, intervals, threshold, xlabel }) {
  const W = 320, H = 110, padL = 80, padR = 20, padT = 20, padB = 28;
  const plotW = W - padL - padR;
  const allVals = intervals.flatMap(d => [d.lo, d.hi, d.mean]);
  if (threshold !== undefined) allVals.push(threshold);
  const minV = Math.min(...allVals) - 0.5;
  const maxV = Math.max(...allVals) + 0.5;
  const sc = v => padL + ((v - minV) / (maxV - minV)) * plotW;
  const rowH = (H - padT - padB) / Math.max(intervals.length, 1);
  const colors = ['var(--rune-bright)', 'var(--sage-bright)', 'var(--gold)', 'var(--ember)'];

  const rows = intervals.map((d, i) => {
    const y = padT + i * rowH + rowH / 2;
    const x1 = sc(d.lo), x2 = sc(d.hi), xm = sc(d.mean);
    const col = colors[i % colors.length];
    return `<text x="${(padL - 6).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-dim)" font-family="Cinzel,serif">${d.label}</text>
      <line x1="${x1.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="2.5"/>
      <line x1="${x1.toFixed(1)}" x2="${x1.toFixed(1)}" y1="${(y-6).toFixed(1)}" y2="${(y+6).toFixed(1)}" stroke="${col}" stroke-width="2"/>
      <line x1="${x2.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${(y-6).toFixed(1)}" y2="${(y+6).toFixed(1)}" stroke="${col}" stroke-width="2"/>
      <circle cx="${xm.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${col}"/>
      <text x="${(x1 - 4).toFixed(1)}" y="${(y - 9).toFixed(1)}" font-size="8" fill="${col}" font-family="Crimson Pro,serif" text-anchor="middle">${d.lo}</text>
      <text x="${(x2 + 4).toFixed(1)}" y="${(y - 9).toFixed(1)}" font-size="8" fill="${col}" font-family="Crimson Pro,serif" text-anchor="middle">${d.hi}</text>`;
  }).join('');

  const threshLine = threshold !== undefined
    ? `<line x1="${sc(threshold).toFixed(1)}" x2="${sc(threshold).toFixed(1)}" y1="${padT - 4}" y2="${H - padB}" stroke="var(--gold-bright)" stroke-width="1.5" stroke-dasharray="4,3"/>
       <text x="${sc(threshold).toFixed(1)}" y="${padT - 7}" text-anchor="middle" font-size="8" fill="var(--gold-bright)" font-family="Cinzel,serif">${threshold}</text>` : '';

  const axis = `<line x1="${padL}" x2="${padL + plotW}" y1="${H - padB}" y2="${H - padB}" stroke="var(--border-bright)" stroke-width="1"/>`;
  const xLab = `<text x="${(padL + plotW / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="8.5" fill="var(--text-muted)" font-family="Cinzel,serif">${xlabel}</text>`;

  return `<div style="text-align:center; margin:0.6rem 0">
    <div style="font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px">${title}</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%; display:block; margin:0 auto; background:var(--surface2); border-radius:4px; border:1px solid var(--border)">
      ${axis}${threshLine}${rows}${xLab}
    </svg></div>`;
}

function makePValueDiagram({ p, label }) {
  const W = 300, H = 100, padL = 14, padR = 14, padT = 18, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const pts = 100;
  const norm = x => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
  const xMin = -3.6, xMax = 3.6;
  const zCrit = p === 0.05 ? 1.96 : p === 0.03 ? 2.17 : p === 0.01 ? 2.58 : 1.96;
  const sc = x => padL + ((x - xMin) / (xMax - xMin)) * plotW;
  const scY = y => padT + plotH - (y / norm(0)) * plotH * 0.88;

  const curvePts = Array.from({ length: pts + 1 }, (_, i) => {
    const x = xMin + (i / pts) * (xMax - xMin);
    return `${sc(x).toFixed(1)},${scY(norm(x)).toFixed(1)}`;
  }).join(' ');

  const buildTail = (x0, x1) => {
    const tailPts = [];
    const steps = 40;
    for (let i = 0; i <= steps; i++) {
      const x = x0 + (i / steps) * (x1 - x0);
      tailPts.push(`${sc(x).toFixed(1)},${scY(norm(x)).toFixed(1)}`);
    }
    tailPts.push(`${sc(x1).toFixed(1)},${scY(0).toFixed(1)}`);
    tailPts.push(`${sc(x0).toFixed(1)},${scY(0).toFixed(1)}`);
    return `<polygon points="${tailPts.join(' ')}" fill="var(--blood)" opacity="0.55"/>`;
  };

  const axis = `<line x1="${padL}" x2="${padL + plotW}" y1="${padT + plotH}" y2="${padT + plotH}" stroke="var(--border-bright)" stroke-width="1"/>`;
  const curve = `<polyline points="${curvePts}" fill="none" stroke="var(--rune-bright)" stroke-width="1.8"/>`;
  const rightTail = buildTail(zCrit, xMax);
  const leftTail = buildTail(xMin, -zCrit);
  const zLine = `<line x1="${sc(zCrit).toFixed(1)}" x2="${sc(zCrit).toFixed(1)}" y1="${padT}" y2="${padT + plotH}" stroke="var(--gold)" stroke-width="1.2" stroke-dasharray="3,2"/>`;
  const zLabel = `<text x="${sc(zCrit).toFixed(1)}" y="${padT + plotH + 13}" text-anchor="middle" font-size="8" fill="var(--gold)" font-family="Cinzel,serif">z=${zCrit}</text>`;
  const pLabel = `<text x="${sc((zCrit + xMax) / 2).toFixed(1)}" y="${padT + plotH - 6}" text-anchor="middle" font-size="8" fill="var(--blood)" font-family="Crimson Pro,serif">p/2</text>`;
  const h0Label = `<text x="${(padL + plotW / 2).toFixed(1)}" y="${padT - 4}" text-anchor="middle" font-size="8" fill="var(--text-muted)" font-family="Cinzel,serif">Distribution if H\u2080 true — shaded area = p</text>`;

  return `<div style="text-align:center; margin:0.6rem 0">
    <div style="font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px">${label}</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%; display:block; margin:0 auto; background:var(--surface2); border-radius:4px; border:1px solid var(--border)">
      ${axis}${leftTail}${rightTail}${curve}${zLine}${zLabel}${pLabel}${h0Label}
    </svg></div>`;
}

function makeArcheryTargets() {
  const ring = (cx, r, i) => `<circle cx="${cx}" cy="72" r="${r}" fill="none" stroke="var(--border-bright)" stroke-width="${i===0?1.5:1}" opacity="${0.3+i*0.17}"/>`;
  const target = (cx, hits, color, label, sublabel) => {
    const rings = [32, 23, 15, 8].map((r, i) => ring(cx, r, i)).join('');
    const bull = `<circle cx="${cx}" cy="72" r="4" fill="var(--blood)" opacity="0.7"/>`;
    const arrows = hits.map(([dx, dy]) =>
      `<circle cx="${(cx+dx).toFixed(1)}" cy="${(72+dy).toFixed(1)}" r="3.2" fill="${color}" stroke="var(--bg)" stroke-width="1" opacity="0.92"/>`
    ).join('');
    return `${rings}${bull}${arrows}
      <text x="${cx}" y="114" text-anchor="middle" font-size="8.5" fill="var(--text-dim)" font-family="Cinzel,serif">${label}</text>
      <text x="${cx}" y="124" text-anchor="middle" font-size="7.5" fill="var(--text-muted)" font-family="Crimson Pro,serif" font-style="italic">${sublabel}</text>`;
  };
  return `<div style="text-align:center; margin:0.7rem 0">
    <div style="font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px">Reliability vs Validity</div>
    <svg viewBox="0 0 300 132" width="300" style="max-width:100%; display:block; margin:0 auto; background:var(--surface2); border-radius:4px; border:1px solid var(--border)">
      ${target(50,  [[-1,1],[1,-2],[0,2],[-2,0],[2,-1]], 'var(--sage-bright)', 'Reliable + Valid', 'tight & on target')}
      ${target(150, [[-2+12,1+12],[1+12,-2+12],[0+12,2+12],[-2+12,0+12],[2+12,-1+12]], 'var(--ember)', 'Reliable, not Valid', 'tight, wrong spot')}
      ${target(250, [[-11,9],[7,-13],[13,5],[-5,-9],[4,14],[-9,3]], 'var(--rune-bright)', 'Unreliable', 'arrows everywhere')}
    </svg></div>`;
}

// SVG HISTOGRAM HELPER
// Draws a simple histogram as inline SVG
// bars: array of heights (0-120), labels: x-axis labels
// annotation: optional string displayed below
// ══════════════════════════════════════════════════════
function makeHistogram({ bars, title, xlabel, color = 'var(--rune)', annotation = '' }) {
  const W = 300, H = 160, padL = 28, padB = 30, padT = 10, padR = 10;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const maxBar = 120;
  const n = bars.length;
  const barW = plotW / n;
  const gap = 2;

  const rects = bars.map((h, i) => {
    const barH = (h / maxBar) * plotH;
    const x = padL + i * barW + gap / 2;
    const y = padT + plotH - barH;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW - gap).toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="0.75" rx="1"/>`;
  }).join('');

  // Y axis ticks: 0, 50%, 100%
  const yTicks = [0, 0.5, 1].map(p => {
    const y = padT + plotH - p * plotH;
    return `<line x1="${padL}" x2="${padL - 4}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--text-muted)" stroke-width="1"/>`;
  }).join('');

  // Axis lines
  const axes = `
    <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT + plotH}" stroke="var(--border-bright)" stroke-width="1"/>
    <line x1="${padL}" x2="${padL + plotW}" y1="${padT + plotH}" y2="${padT + plotH}" stroke="var(--border-bright)" stroke-width="1"/>`;

  // X label
  const xLab = `<text x="${(padL + plotW / 2).toFixed(1)}" y="${H - 2}" text-anchor="middle" font-size="9" fill="var(--text-muted)" font-family="Cinzel, serif">${xlabel}</text>`;

  // Annotation text
  const annEl = annotation
    ? `<text x="${(W / 2).toFixed(1)}" y="${padT + 14}" text-anchor="middle" font-size="9" fill="${color}" font-family="Crimson Pro, serif" font-style="italic">${annotation}</text>`
    : '';

  return `<div style="text-align:center; margin: 0.6rem 0">
    <div style="font-family:'Cinzel',serif; font-size:0.65rem; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; margin-bottom:4px">${title}</div>
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%; display:block; margin:0 auto; background:var(--surface2); border-radius:4px; border:1px solid var(--border)">
      ${axes}${yTicks}${rects}${xLab}${annEl}
    </svg>
  </div>`;
}

// JAMOVI-STYLE OUTPUT TABLE HELPER
// ══════════════════════════════════════════════════════
function jamoviOutput({ title, rows }) {
  const headerRow = `<tr>${rows[0].map(h => `<th>${h}</th>`).join('')}</tr>`;
  const dataRows = rows.slice(1).map(r =>
    `<tr>${r.map((cell, i) => i === 0 ? `<td class="jmv-row-label">${cell}</td>` : `<td>${cell}</td>`).join('')}</tr>`
  ).join('');
  return `<div class="jmv-output">
    <div class="jmv-title">${title}</div>
    <table class="jmv-table">
      <thead>${headerRow}</thead>
      <tbody>${dataRows}</tbody>
    </table>
    <div class="jmv-note">Note. Computed using jamovi 2.4</div>
  </div>`;
}

// PARTICLES

function spawnParticles() {
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'ember-particle';
    p.style.cssText = `
      left: ${Math.random()*100}vw;
      animation-duration: ${4 + Math.random()*6}s;
      animation-delay: ${Math.random()*8}s;
      --drift: ${(Math.random()-0.5)*60}px;
      width: ${1+Math.random()*2}px;
      height: ${1+Math.random()*2}px;
    `;
    document.body.appendChild(p);
  }
}

// ══════════════════════════════════════════════════════
// HUD
// ══════════════════════════════════════════════════════
function updateHUD() {
  const hud = document.getElementById('hud');
  if (!G.class) { hud.classList.remove('visible'); return; }
  hud.classList.add('visible');

  const cls = CLASSES[G.class];
  document.getElementById('hud-class-name').textContent = cls.name;

  const hpPct = Math.max(0, (G.hp / G.maxHp) * 100);
  const fill = document.getElementById('hud-hp-fill');
  fill.style.width = hpPct + '%';
  fill.style.background = hpPct > 60 ? 'var(--hp-full)' : hpPct > 30 ? 'var(--hp-mid)' : hpPct > 15 ? 'var(--hp-low)' : 'var(--hp-crit)';
  document.getElementById('hud-hp-text').textContent = `${G.hp}/${G.maxHp}`;

  const xpPct = Math.min(100, (G.xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100);
  document.getElementById('hud-xp-fill').style.width = xpPct + '%';
  document.getElementById('hud-xp-text').textContent = `${G.xp} (Lv ${G.level})`;

  if (G.currentQuest) {
    const q = QUESTS[G.currentQuest];
    document.getElementById('hud-quest').textContent = `${q.chapter}: ${q.topic}`;
  }
}

// ══════════════════════════════════════════════════════
// XP & LEVELLING — FIX: Use pendingLevelUpCallback global
// ══════════════════════════════════════════════════════
function gainXP(amount, callback) {
  const oldLevel = G.level;
  G.xp += amount;
  G.level = Math.floor(G.xp / XP_PER_LEVEL) + 1;
  updateHUD();
  if (G.level > oldLevel) {
    showLevelUp(G.level, callback);
  } else {
    if (callback) callback();
  }
}

// FIX: Store callback in global variable — never serialize to string
function showLevelUp(level, callback) {
  pendingLevelUpCallback = callback;
  const el = document.getElementById('main-content');
  el.innerHTML = `
    <div class="levelup-screen">
      <span class="levelup-icon">✨</span>
      <div class="levelup-title">Level ${level}!</div>
      <p style="color:var(--text-dim); font-family:'Cinzel',serif; font-size:0.8rem; letter-spacing:0.1em; margin-bottom:1.5rem">YOUR KNOWLEDGE GROWS STRONGER</p>
      <button class="btn btn-gold" onclick="continueLevelUp()">Continue ›</button>
    </div>`;
}

// FIX: Global function that fires the stored callback
function continueLevelUp() {
  if (pendingLevelUpCallback) {
    const cb = pendingLevelUpCallback;
    pendingLevelUpCallback = null;
    cb();
  }
}

// ══════════════════════════════════════════════════════
// DAMAGE / DEATH
// ══════════════════════════════════════════════════════
function takeDamage(amount) {
  G.hp = Math.max(0, G.hp - amount);
  updateHUD();

  const flash = document.createElement('div');
  flash.className = 'attack-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 500);

  document.getElementById('main-content').classList.add('shake');
  setTimeout(() => document.getElementById('main-content').classList.remove('shake'), 400);

  const dmg = document.createElement('div');
  dmg.className = 'dmg-number';
  dmg.style.cssText = `color:var(--blood); top:${window.innerHeight*0.4}px; left:${window.innerWidth*0.5-30}px;`;
  dmg.textContent = `-${amount} HP`;
  document.body.appendChild(dmg);
  setTimeout(() => dmg.remove(), 1200);

  if (G.hp <= 0) {
    setTimeout(showDeath, 600);
    return true;
  }
  return false;
}

function showDeath() {
  if (G.bossTimer) clearInterval(G.bossTimer);
  const el = document.getElementById('main-content');
  el.innerHTML = `
    <div class="card">
      <div class="death-screen">
        <span class="death-icon">💀</span>
        <div class="death-title">You Have Fallen</div>
        <div class="death-sub">The Quest Claims Another Soul</div>
        <div class="box box-danger" style="text-align:left; margin-bottom:1.5rem">
          <span class="box-title">⚔ The Order's Chronicle</span>
          You fought valiantly. The monsters of statistical misunderstanding are formidable. 
          But in the Order of the Significant P, death is a teacher — not an ending. Your HP is restored. 
          Return to the questline and face your demons again.
        </div>
        <button class="btn btn-primary" onclick="restartQuest()">⚔ Rise Again — Retry Quest</button>
        &nbsp;&nbsp;
        <button class="btn btn-ghost" onclick="showMap()">↩ Retreat to the Archive</button>
      </div>
    </div>`;
}

function restartQuest() {
  const cls = CLASSES[G.class];
  G.hp = cls.hp;
  if (G.currentQuest) {
    startQuest(G.currentQuest);
  } else {
    showMap();
  }
  updateHUD();
}

  const progress = step + 1;
  const el = document.getElementById('main-content');
  el.innerHTML = `
    <div class="card scene-wrap">
      <div class="card-rune-tl">✦</div>
      <div class="card-rune-br">✦</div>

          <div class="scene-chapter">${scene.chapter}</div>

            </button>`).join('')}
        </div>

  el.querySelectorAll('[data-sort-index]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-sort-index'), 10);
      handleSortingChoice(_sortingChoices[idx]);
    });
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

function handleSortingChoice(choice) {
  _sortingTally[choice.cls]++;
  const next = _sortingStep + 1;
  if (next < SORTING_SCENES.length) {
    showSortingScene(next);
  } else {
    showSortingResult();
  }
}

function startQuest(questId) {
  G.currentQuest = questId;
  const cls = CLASSES[G.class];
  G.hp = cls.hp; // restore HP at quest start
  updateHUD();
  const quest = QUESTS[questId];
  showScene(quest.scenes[0]);
}

// Store current scene choices so buttons can reference by index (avoids JSON-in-HTML quoting bugs)
let _currentChoices = [];
// Store current boss choices similarly
let _currentBossChoices = [];

function showScene(sceneId) {
  showOracleButton();
  G.currentScene = sceneId;

  if (sceneId.startsWith('BOSS_')) {
    vnHide();
    const questId = sceneId.replace('BOSS_', '');
    startBoss(questId);
    return;
  }

  const scene = SCENES[sceneId];
  if (!scene) { showMap(); return; }

  // If scene has beats, use VN engine
  if (scene.beats && scene.beats.length > 0) {
    vnPlayScene(scene, sceneId);
    return;
  }

  // Fallback: legacy card rendering (dead-end scenes with single back button)
  vnHide();
  const cls = CLASSES[G.class];
  const hint = scene.hints ? scene.hints[cls.hintType] : null;
  _currentChoices = scene.choices;

  const el = document.getElementById('main-content');
  el.innerHTML = `
    <div class="card scene-wrap">
      <div class="card-rune-tl">✦</div>
      <div class="card-rune-br">✦</div>
      <div class="scene-header">
        <div class="scene-icon-lg">${scene.icon}</div>
        <div>
          <div class="scene-chapter">${scene.chapter}</div>
          <div class="scene-title">${scene.title}</div>
        </div>
      </div>
      ${hint ? `<div class="hint-box show"><span class="hint-label">${cls.hintLabel}</span>${hint}</div>` : ''}
      <div class="narrative">${scene.narrative}</div>
      <div class="choices-wrap">
        <div class="choices-label">— What do you do? —</div>
        <div class="choices">
          ${scene.choices.map((c,i) => `
            <button class="choice-btn scroll-item" style="animation-delay:${i*0.08}s"
                    data-choice-index="${i}">
              ${c.text}
            </button>`).join('')}
        </div>
      </div>
    </div>`;

  el.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-choice-index'), 10);
      handleChoice(_currentChoices[idx]);
    });
  });

  window.scrollTo({top:0, behavior:'smooth'});
}

function handleChoice(choice) {
  if (choice.boss) {
    showScene(choice.next);
    return;
  }
  if (choice.damage) {
    const dead = takeDamage(choice.damage);
    if (dead) return;
  }
  if (choice.xp) {
    gainXP(choice.xp, () => showScene(choice.next));
    return;
  }
  showScene(choice.next);
}

function startBoss(questId) {
  audioSceneChange('boss');

    questId,

}

function renderBossPhase() {
  const { battle, phase, bossHp } = bossData;
  const phaseData = battle.phases[phase];

  const el = document.getElementById('main-content');
  el.innerHTML = `
    <div class="boss-arena scene-wrap">
      <div class="boss-header">
        <div class="boss-icon">${battle.icon}</div>
        <div>
          <div class="boss-name">${battle.name}</div>

        </div>
        <div class="boss-hp-block">
          <div class="boss-hp-label">BOSS HP</div>
          <div class="boss-hp-track">
            <div class="boss-hp-fill" id="boss-hp-fill" style="width:${bossHp}%"></div>
          </div>
        </div>
      </div>
      <div class="boss-timer-wrap">
        <div class="timer-label">Time Remaining</div>
        <div class="boss-timer" id="boss-timer">${bossData.timeLeft}</div>
        <div class="timer-label">seconds</div>
      </div>
      <div class="boss-body">
        <div class="phase-indicator">
          ${battle.phases.map((p,i) => `
            <div class="phase-dot ${i < phase ? 'done' : i === phase ? 'active' : ''}"></div>
          `).join('')}
          <span class="phase-label">Phase ${phase+1}: ${phaseData.label}</span>
        </div>
        <div class="boss-narrative">${phaseData.narrative}</div>
        <div class="boss-choices" id="boss-choices">
          ${(() => {
            const shuffled = shuffle(phaseData.choices.map((c,i)=>({...c,origIdx:i})));
            _currentBossChoices = shuffled;
            return shuffled.map((c,i) => `
              <button class="boss-choice" data-boss-choice-index="${i}">
                ${c.text}
              </button>`).join('');
          })()}
        </div>
      </div>
    </div>`;

  // Attach boss choice handlers via JS — avoids inline JSON quoting bugs
  el.querySelectorAll('.boss-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-boss-choice-index'), 10);
      handleBossChoice(btn, _currentBossChoices[idx]);
    });
  });

  startBossTimer();
  window.scrollTo({top:0, behavior:'smooth'});
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startBossTimer() {
  if (G.bossTimer) clearInterval(G.bossTimer);
  G.bossTimer = setInterval(() => {
    bossData.timeLeft--;
    const timerEl = document.getElementById('boss-timer');
    if (!timerEl) { clearInterval(G.bossTimer); return; }
    timerEl.textContent = bossData.timeLeft;
    if (bossData.timeLeft <= 10) timerEl.classList.add('urgent');
    if (bossData.timeLeft <= 0) {
      clearInterval(G.bossTimer);
      const dead = takeDamage(20);
      if (!dead) {
        showBossFeedback(null, false, '⏰ Time ran out! The monster attacks for −20 HP. Think faster next time!', () => {
          bossData.timeLeft = bossData.battle.timePerPhase;
          renderBossPhase();
        });
      }
    }
  }, 1000);
}

function handleBossChoice(btn, choice) {
  clearInterval(G.bossTimer);
  document.querySelectorAll('.boss-choice').forEach(b => b.disabled = true);

  if (choice.correct) {
    bossData.bossHp = Math.max(0, bossData.bossHp - 34);
    const fill = document.getElementById('boss-hp-fill');
    if (fill) fill.style.width = bossData.bossHp + '%';

    const flash = document.createElement('div');
    flash.className = 'attack-flash';
    flash.style.setProperty('--flash-color', 'rgba(45,212,116,0.25)');
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 500);

    gainXP(10, () => {});

    const isLastPhase = bossData.phase >= bossData.battle.phases.length - 1;
    showBossFeedback(btn, true, choice.feedback, () => {
      if (isLastPhase) {
        bossVictory();
      } else {
        bossData.phase++;
        bossData.timeLeft = bossData.battle.timePerPhase;
        renderBossPhase();
      }
    });
  } else {
    const dead = takeDamage(20);
    showBossFeedback(btn, false, choice.feedback, () => {
      if (!dead) {
        bossData.timeLeft = bossData.battle.timePerPhase;
        renderBossPhase();
      }
    });
  }
}

function showBossFeedback(btn, correct, feedback, callback) {
  const choicesEl = document.getElementById('boss-choices');
  if (!choicesEl) { if (callback) setTimeout(callback, 1800); return; }

  const fb = document.createElement('div');
  fb.className = correct ? 'box box-victory' : 'box box-danger';
  fb.style.marginTop = '1rem';
  fb.innerHTML = `<span class="box-title">${correct ? '✅ Correct!' : '❌ Wrong!'}</span>${feedback}`;
  choicesEl.after(fb);

  setTimeout(() => { if (callback) callback(); }, 2500);
}

function bossVictory() {
  clearInterval(G.bossTimer);
  const quest = QUESTS[G.currentQuest];

  // FIX: Ensure quest is marked done BEFORE gainXP to guarantee unlock
  if (!G.questsDone.includes(G.currentQuest)) {
    G.questsDone.push(G.currentQuest);
  }
  saveProgress();
  // Give enough XP to guarantee the next level threshold is crossed
  const xpNeeded = (G.level * XP_PER_LEVEL) - G.xp;
  const xpToGrant = Math.max(40, xpNeeded > 0 ? xpNeeded : 40);
  gainXP(xpToGrant, () => showQuestComplete(quest));
}

    q0: `<strong>Measurement levels:</strong> Nominal (labels) → Ordinal (ordered) → Interval (equal gaps) → Ratio (true zero). Level determines valid statistics.<br>
    <strong>Charts:</strong> 1 continuous → Histogram. 1 categorical → Bar/pie. 2 continuous → Scatter. Mixed → Error bar/box plot.<br>
    <strong>Hypotheses:</strong> H₀ and H₁ must be written before data collection. p = probability of data under H₀, not probability H₁ is true.<br>
    <strong>Errors:</strong> Type I = false positive (α risk). Type II = false negative (power). <strong>Sampling:</strong> Probability methods (systematic, stratified) give known selection chances. Convenience and snowball do not.<br>
    <strong>Validity</strong> = measuring the right thing. <strong>Reliability</strong> = measuring it consistently.`,
    q1: `<strong>Pearson's r</strong> measures linear association between two continuous variables. Range: -1 to +1.<br>Always plot a scatter first — check for linearity. Curved pattern → use Spearman instead.<br>p-value = probability of r this extreme if the true correlation is zero. <strong>Significant never means causal.</strong>`,
    q2: `<strong>Chi-Square</strong> tests independence between two categorical variables.<br>Expected counts: E = (row total × col total) / grand total. All E ≥ 5 required.<br>If any E &lt; 5 → Fisher's Exact Test. Significant result = association exists but doesn't specify which cells — examine standardised residuals for that.`,
    q3: `<strong>Paired t-test:</strong> same subjects measured twice. <strong>One-sample t-test:</strong> compare group mean to a known benchmark. <strong>Independent t-test:</strong> two completely separate groups.<br>Levene's p &lt; 0.05 → use Welch's t-test (not Student's).<br>One-tailed testing: only valid with a pre-registered directional hypothesis — never chosen after seeing results.`,
    q3b: `<strong>Normality check first:</strong> always inspect histograms before choosing a test for two independent groups.<br>
    <strong>Shapiro-Wilk:</strong> W close to 1 = normal. p &lt; 0.05 = significant departure from normality. Reliable at n = 15–100.<br>
    <strong>Decision rule:</strong> check normality AND Levene's. Both pass → Student's t. Normality passes, Levene's fails → Welch's t. Either group non-normal → <strong>Mann-Whitney U</strong> (Levene's result irrelevant).<br>
    Mann-Whitney U compares rank ordering, not means — more honest when data is skewed.`,
    q4: `<strong>ANOVA</strong> compares means across 3+ groups in one test — preventing false positive inflation from multiple t-tests.<br>Levene's significant → <strong>Welch's ANOVA → Games-Howell</strong> post-hoc.<br>Levene's non-significant → <strong>Fisher's ANOVA → Tukey/Bonferroni</strong> post-hoc.<br>Significant F = at least one group differs. Post-hoc tests reveal which specific pairs.`
  };

  el.innerHTML = `
    <div class="card scene-wrap">
      <div class="quest-complete-banner">

        <button class="btn btn-gold" onclick="showMap()">↩ Return to Archive</button>
      </div>
    </div>`;

  window.scrollTo({top:0, behavior:'smooth'});
}

const ORACLE_CONTENT = {

    <h4>How to Read an MC Question</h4>
    <div class="oracle-tip gold">
      <strong>Step 1 — Find the real question.</strong> Read the stem twice. Underline the key verb: "which test", "what does this mean", "what is wrong with". The question is often buried after a long scenario.
    </div>
    <div class="oracle-tip gold">
      <strong>Step 2 — Cover the options.</strong> Before reading A–D, form your own rough answer. Then find the closest match. This stops the options from hijacking your thinking before you've engaged with the question.
    </div>
    <div class="oracle-tip gold">
      <strong>Step 3 — Eliminate first.</strong> Cross out anything you know is wrong. Eliminate 2 and you have a 50/50. Never leave a question blank — there is no penalty for guessing.
    </div>
    <div class="oracle-tip gold">
      <strong>Step 4 — Watch for scope.</strong> Options that are statistically true but don't answer this specific question are classic traps. Ask: does this answer <em>what was asked</em>, not just <em>something correct</em>?
    </div>
    <h4>Strip the Scenario</h4>
    <div class="oracle-tip">The hotel, the manager, the guest names — decoration. Strip them away and ask: what statistical concept is this question actually testing? Every question tests one thing.</div>
    <h4>Pacing</h4>
    <div class="oracle-tip">60 questions. ~1 minute each. Flag uncertain ones and return. Never spend 4 minutes on one question when you haven't seen the next three.</div>
  `,

    <h4>The Most Common Traps in Stats MC</h4>
    <div class="oracle-tip danger">
      <strong>True-But-Irrelevant.</strong> An answer that is correct in general but wrong for this scenario. "Pearson's r measures linear association" is always true — but it's wrong if the data is non-linear and the question asks what to do next.
    </div>
    <div class="oracle-tip danger">
      <strong>Concept Swaps.</strong> Examiners love to swap paired concepts: Levene's vs Shapiro-Wilk · Type I vs Type II · Fisher's vs Welch's · one-tailed vs two-tailed · validity vs reliability. Know these pairs cold.
    </div>
    <div class="oracle-tip danger">
      <strong>Causation Creep.</strong> An option that correctly describes a correlation but adds "therefore X causes Y." Correlation never implies causation. Any option that makes this leap is wrong.
    </div>
    <div class="oracle-tip danger">
      <strong>The p-value Inversion.</strong> "p = 0.03 means 97% certain" or "p = 0.03 proves H₁." Wrong. p is the probability of your data under H₀ — not the probability your hypothesis is true.
    </div>

let _oracleOpen = false;

function toggleOracle() {
  _oracleOpen = !_oracleOpen;
  const panel = document.getElementById('oracle-panel');
  const btn   = document.getElementById('oracle-toggle');
  if (_oracleOpen) {
    panel.classList.add('open');
    btn.style.transform = 'scale(1.05)';
    const body = document.getElementById('oracle-body');
    if (!body.innerHTML.trim()) body.innerHTML = ORACLE_CONTENT.mc;
  } else {
    panel.classList.remove('open');
    btn.style.transform = '';
  }
}

function oracleTab(el, tab) {
  document.querySelectorAll('.oracle-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('oracle-body').innerHTML = ORACLE_CONTENT[tab];
}

function showOracleButton() {
  document.getElementById('oracle-toggle').classList.add('visible');
}
function hideOracleButton() {
  document.getElementById('oracle-toggle').classList.remove('visible');
  document.getElementById('oracle-panel').classList.remove('open');
  _oracleOpen = false;
}

// Player character — determined by class
function getPlayerChar() {
  const map = { wizard: 'player_wizard', healer: 'player_healer', rogue: 'player_rogue' };
  return CHARS[map[G.class] || 'player_wizard'];
}

// VISUAL NOVEL ENGINE
// ══════════════════════════════════════════════════════
let VN = {
  beats: [],
  beatIndex: 0,
  choices: [],
  typing: false,
  typeTimer: null,
  currentText: '',
  displayedText: '',
  onChoiceSelect: null,
};

const BG_CLASS = {
  archive: 'vn-bg-archive',
  lobby:   'vn-bg-lobby',
  banquet: 'vn-bg-banquet',
  cellar:  'vn-bg-cellar',
  spa:     'vn-bg-spa',
  castle:  'vn-bg-castle',
  boss:    'vn-bg-boss',
};

function vnShow() {
  document.getElementById('vn-stage').classList.add('active');
  document.getElementById('main-content').style.display = 'none';
  showOracleButton();
}

function vnHide() {
  document.getElementById('vn-stage').classList.remove('active');
  document.getElementById('main-content').style.display = '';
  hideOracleButton();
}

function vnSetBackground(key) {
  const bg = document.getElementById('vn-bg');
  bg.className = BG_CLASS[key] || BG_CLASS.archive;
  audioSceneChange(key);
}

function vnSetChar(side, charKey, active) {
  const id = `vn-char-${side}`;
  const el = document.getElementById(id);
  if (!charKey) {
    el.classList.add('hidden');
    el.innerHTML = '';
    return;
  }
  const resolvedKey = charKey === 'player' ? `player_${G.class}` : charKey;
  const charDef = CHARS[resolvedKey] || getPlayerChar();
  const h = window.innerHeight < 600 ? 220 : 300;
  el.innerHTML = charDef.svg(h);
  el.classList.remove('hidden','dim','active','speaking');
  if (active) {
    el.classList.add('active', 'speaking');
  } else {
    el.classList.add('dim');
  }
}

function vnFlash(type) {
  const el = document.getElementById('vn-flash');
  el.className = `flash-${type}`;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; el.className = ''; }, 350);
}

// Show chapter title card briefly
function vnChapterCard(icon, name, topic, cb) {
  const card = document.getElementById('vn-chapter-card');
  document.getElementById('vn-cc-sigil').textContent = icon;
  document.getElementById('vn-cc-name').textContent = name;
  document.getElementById('vn-cc-topic').textContent = topic;
  card.classList.add('show');
  setTimeout(() => {
    card.classList.remove('show');
    setTimeout(cb, 500);
  }, 1800);
}

// Type out text word by word
function vnTypeText(text, cb) {
  const area = document.getElementById('vn-text-area');
  // Check if text contains HTML (lore boxes etc) — show immediately, no typewriter
  if (!text || typeof text !== 'string') {
    area.innerHTML = '';
    VN.typing = false;
    if (cb) cb();
    return;
  }
  const hasHtml = /<[a-zA-Z]/.test(text);
  if (hasHtml) {
    area.innerHTML = text;
    VN.typing = false;
    if (cb) cb();
    return;
  }
  VN.typing = true;
  VN.currentText = text;
  VN.displayedText = '';
  area.textContent = '';
  let i = 0;
  const words = text.split(' ');
  function nextWord() {
    if (i >= words.length) {
      VN.typing = false;
      if (cb) cb();
      return;
    }
    VN.displayedText += (i > 0 ? ' ' : '') + words[i];
    area.textContent = VN.displayedText;
    i++;
    VN.typeTimer = setTimeout(nextWord, 42);
  }
  nextWord();
}

function vnSkipType() {
  if (VN.typing) {
    clearTimeout(VN.typeTimer);
    VN.typing = false;
    const area = document.getElementById('vn-text-area');
    area.textContent = VN.currentText;
  }
}

// Advance to next beat or show choices
function vnAdvance() {
  if (VN.typing) {
    vnSkipType();
    return;
  }
  VN.beatIndex++;
  if (VN.beatIndex < VN.beats.length) {
    vnPlayBeat(VN.beatIndex);
  } else {
    vnShowChoices();
  }
}

function vnPlayBeat(idx) {
  const beat = VN.beats[idx];
  const nameBox = document.getElementById('vn-namebox');
  const tapHint = document.getElementById('vn-tap-hint');
  const choicesEl = document.getElementById('vn-choices');

  choicesEl.classList.remove('visible');
  tapHint.style.display = '';

  // Determine speaker
  let charKey = beat.char || null;
  let charName = '—';
  if (charKey === 'player') {
    charKey = `player_${G.class}`;
    charName = 'You';
  } else if (charKey && CHARS[charKey]) {
    charName = CHARS[charKey].name;
  }

  nameBox.textContent = charName;

  // Update character displays
  const resolveP = k => k === 'player' ? `player_${G.class}` : k;
  const beatLeft  = beat.left  !== undefined ? resolveP(beat.left)  : undefined;
  const beatRight = beat.right !== undefined ? resolveP(beat.right) : undefined;
  const beatChar  = charKey; // already resolved above
  if (beatLeft  !== undefined) vnSetChar('left',  beatLeft,  beatChar === beatLeft);
  if (beatRight !== undefined) vnSetChar('right', beatRight, beatChar === beatRight);

  // Highlight speaking character
  const leftEl = document.getElementById('vn-char-left');
  const rightEl = document.getElementById('vn-char-right');
  if (beatChar && beatChar === beatLeft) {
    leftEl.classList.remove('dim'); leftEl.classList.add('active','speaking');
    rightEl.classList.remove('active','speaking'); if (beatRight) rightEl.classList.add('dim');
  } else if (beatChar && beatChar === beatRight) {
    rightEl.classList.remove('dim'); rightEl.classList.add('active','speaking');
    leftEl.classList.remove('active','speaking'); if (beatLeft) leftEl.classList.add('dim');
  } else {
    // Narrator
    nameBox.textContent = '—';
    leftEl.classList.remove('active','speaking');
    rightEl.classList.remove('active','speaking');
  }

  if (beat.html) {
    const area = document.getElementById('vn-text-area');
    area.innerHTML = beat.html;
    VN.typing = false;
  } else {
    vnTypeText(beat.text || '');
  }
}

function vnShowChoices() {
  const choicesEl = document.getElementById('vn-choices');
  const tapHint = document.getElementById('vn-tap-hint');
  tapHint.style.display = 'none';

  choicesEl.innerHTML = VN.choices.map((c,i) =>
    `<button class="vn-choice-btn" data-vi="${i}">${c.text}</button>`
  ).join('');
  choicesEl.classList.add('visible');

  choicesEl.querySelectorAll('.vn-choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-vi'), 10);
      vnPickChoice(VN.choices[idx]);
    });
  });
}

function vnPickChoice(choice) {
  document.getElementById('vn-choices').classList.remove('visible');
  document.getElementById('vn-tap-hint').style.display = '';

  if (choice.bad || choice.damage) {
    vnFlash('damage');
    const dead = takeDamage(choice.damage || 10);
    if (dead) return;
    // Show feedback beat then continue to next scene
    vnFeedbackBeat(choice, () => showScene(choice.next));
  } else if (choice.boss) {
    vnHide();
    showScene(choice.next);
  } else {
    vnFlash('xp');
    if (choice.xp) {
      gainXP(choice.xp, () => vnFeedbackBeat(choice, () => showScene(choice.next)));
    } else {
      vnFeedbackBeat(choice, () => showScene(choice.next));
    }
  }
}

function vnFeedbackBeat(choice, cb) {
  // Brief transition — no feedback beat needed, scene change handles it
  cb();
}

// Main entry: play a scene as VN
function vnPlayScene(scene, sceneId) {
  vnShow();
  vnSetBackground(scene.bg || 'archive');
  VN.beats = scene.beats || [];
  VN.beatIndex = 0;
  VN.choices = scene.choices || [];

  // Clear chars
  vnSetChar('left', null);
  vnSetChar('right', null);
  document.getElementById('vn-choices').classList.remove('visible');
  document.getElementById('vn-tap-hint').style.display = '';
  document.getElementById('vn-namebox').textContent = '—';
  document.getElementById('vn-text-area').textContent = '';

  // Set up initial chars from first beat
  if (VN.beats.length > 0) {
    const first = VN.beats[0];
    if (first.left) vnSetChar('left', first.left, first.char === first.left);
    if (first.right) vnSetChar('right', first.right, first.char === first.right);
    vnPlayBeat(0);
  } else {
    vnShowChoices();
  }

  // Tap anywhere on dialogue to advance
  const dialogue = document.getElementById('vn-dialogue');
  dialogue.onclick = (e) => {
    if (e.target.classList.contains('vn-choice-btn')) return;
    if (document.getElementById('vn-choices').classList.contains('visible')) return;
    vnAdvance();
  };
}
