function midiToHz(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// ── Modal / fantasy scales (MIDI, one octave, extended up) ────────────────
// All rooted around D for consistency; scenes transpose via drone root
const SCALES = {
  // D Dorian — minor with raised 6th, classic fantasy/RPG
  dorian:    [38,40,41,43,45,47,48,50,52,53,55,57,59,60,62],
  // D Phrygian — dark, mysterious, minor 2nd gives tension
  phrygian:  [38,39,41,43,45,46,48,50,51,53,55,57,58,60,62],
  // G Mixolydian — bright, heroic, major with flat 7
  mixolydian:[31,33,35,36,38,40,41,43,45,47,48,50,52,53,55],
  // A Aeolian (natural minor) — melancholic, warm
  aeolian:   [33,35,36,38,40,41,43,45,47,48,50,52,53,55,57],
  // B Locrian / diminished — tense, boss music
  locrian:   [35,36,38,40,41,43,45,47,48,50,52,53,55,57,59],
};

// ── Chord voicings per scale (scale-degree indices) ───────────────────────
const CHORDS = {
  dorian:    [[0,2,4],[1,3,5],[3,5,7],[4,6,8],[0,2,4,6]],
  phrygian:  [[0,2,4],[1,3,5],[3,5,7],[2,4,6],[0,3,6]],
  mixolydian:[[0,2,4],[1,3,5],[4,6,8],[2,4,6],[0,2,4,7]],

};

// ── Melodic motifs — sequences of scale-degree steps ─────────────────────
// Each sub-array is a motif: positive = step up, negative = step down
const MOTIFS = {
  dorian:    [[0,2,4,2,0],[0,1,3,2,0,-1],[0,3,2,4,3,1],[0,-1,1,3,4,2,0],[0,2,4,6,5,3,1]],
  phrygian:  [[0,1,3,1,0],[0,-1,1,0,-2],[0,2,1,3,2,0],[0,1,0,-1,1,3,1,0],[0,3,1,0,2,1]],
  mixolydian:[[0,2,4,3,2,0],[0,1,3,5,4,2,0],[0,2,4,6,4,2],[0,3,2,4,3,1,0],[0,2,0,2,4,2,0]],
  aeolian:   [[0,2,1,3,2,0],[0,-1,1,3,2,0],[0,2,4,3,1,0],[0,1,3,5,3,1,0],[0,2,3,5,4,2]],
  locrian:   [[0,1,3,1,0,-1],[0,2,1,3,2,4],[0,-1,-2,0,1,3],[0,3,2,1,3,4,2],[0,2,4,2,0,-1]],
};

// ── Scene → music config ───────────────────────────────────────────────────
const SCENE_MUSIC = {
  title:   { scale:'phrygian',  droneRoot:38, droneIntervals:[0,7,12],   bpm:52,  swing:0.55, layers:['pad','harp','bell'],      reverbMix:0.80, masterVol:0.30, filterFreq:900  },
  sorting: { scale:'aeolian',   droneRoot:33, droneIntervals:[0,7,12,19],bpm:60,  swing:0.50, layers:['pad','harp','bell','arp'], reverbMix:0.68, masterVol:0.33, filterFreq:1100 },
  archive: { scale:'dorian',    droneRoot:38, droneIntervals:[0,7,12],   bpm:48,  swing:0.52, layers:['pad','harp'],             reverbMix:0.72, masterVol:0.36, filterFreq:900  },
  lobby:   { scale:'mixolydian',droneRoot:31, droneIntervals:[0,7,12,19],bpm:68,  swing:0.50, layers:['pad','harp','arp'],       reverbMix:0.55, masterVol:0.34, filterFreq:1400 },
  banquet: { scale:'mixolydian',droneRoot:36, droneIntervals:[0,7,12],   bpm:72,  swing:0.48, layers:['pad','harp','bell','arp'],reverbMix:0.50, masterVol:0.35, filterFreq:1600 },

  boss:    { scale:'locrian',   droneRoot:35, droneIntervals:[0,6,12],   bpm:88,  swing:0.50, layers:['pad','pulse','harp'],     reverbMix:0.75, masterVol:0.50, filterFreq:650  },
  map:     { scale:'dorian',    droneRoot:33, droneIntervals:[0,7,12],   bpm:50,  swing:0.52, layers:['pad','harp','bell'],      reverbMix:0.68, masterVol:0.30, filterFreq:1000 },
};

// ── Build impulse response for reverb ─────────────────────────────────────
function makeReverb(ctx, duration=4.5, decay=2.8) {
  const rate = ctx.sampleRate;
  const len  = rate * duration;
  const buf  = ctx.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      // Layered reverb: early reflections + late diffuse tail
      const early = i < rate * 0.05 ? (Math.random() * 2 - 1) * 0.6 : 0;
      const late   = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      d[i] = early + late;
    }
  }
  return buf;
}

// ── Init AudioContext ──────────────────────────────────────────────────────
function audioInit() {
  if (AUDIO.ctx) return;
  AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = AUDIO.ctx;

  AUDIO.master = ctx.createGain();
  AUDIO.master.gain.value = 0;
  AUDIO.master.connect(ctx.destination);

  // Two reverb sends: long hall + short room
  AUDIO.reverb = ctx.createConvolver();
  AUDIO.reverb.buffer = makeReverb(ctx, 4.5, 2.8);
  AUDIO.reverb2 = ctx.createConvolver();
  AUDIO.reverb2.buffer = makeReverb(ctx, 1.2, 3.5);

  AUDIO.reverbGain = ctx.createGain();
  AUDIO.reverbGain.gain.value = 0.5;
  AUDIO.reverb.connect(AUDIO.reverbGain);
  AUDIO.reverbGain.connect(AUDIO.master);

  AUDIO.reverb2Gain = ctx.createGain();
  AUDIO.reverb2Gain.gain.value = 0.3;
  AUDIO.reverb2.connect(AUDIO.reverb2Gain);
  AUDIO.reverb2Gain.connect(AUDIO.master);

  AUDIO.dryGain = ctx.createGain();
  AUDIO.dryGain.gain.value = 0.5;
  AUDIO.dryGain.connect(AUDIO.master);

  // Master EQ — gentle high shelf rolloff for warmth
  AUDIO.masterEQ = ctx.createBiquadFilter();
  AUDIO.masterEQ.type = 'highshelf';
  AUDIO.masterEQ.frequency.value = 5000;
  AUDIO.masterEQ.gain.value = -4;
  // Re-route master through EQ (insert before destination)
  AUDIO.master.disconnect();
  AUDIO.master.connect(AUDIO.masterEQ);
  AUDIO.masterEQ.connect(ctx.destination);

  AUDIO.started = true;
}

// ── Tremolo pad layer — lush sustained chord tone ─────────────────────────
function makePad(hz, vol=0.07, wave='sine') {
  const ctx = AUDIO.ctx;
  const osc  = ctx.createOscillator();
  const osc2 = ctx.createOscillator(); // slightly detuned for width
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  // Tremolo LFO
  const trem = ctx.createOscillator();
  const tremGain = ctx.createGain();
  trem.frequency.value = 3.2 + Math.random() * 1.4;
  tremGain.gain.value = 0.018;
  trem.connect(tremGain);
  tremGain.connect(gain.gain);
  trem.start();

  // Vibrato LFO for osc detune
  const vib = ctx.createOscillator();
  const vibGain = ctx.createGain();
  vib.frequency.value = 0.22 + Math.random() * 0.1;
  vibGain.gain.value = 4;
  vib.connect(vibGain);
  vibGain.connect(osc.detune);
  vib.start();

  osc.type  = wave;
  osc2.type = 'sine';
  osc.frequency.value  = hz;
  osc2.frequency.value = hz * 1.004; // slight detune for warmth

  filter.type = 'lowpass';
  filter.frequency.value = 1800;
  filter.Q.value = 0.6;

  gain.gain.value = 0;
  osc.connect(filter); osc2.connect(filter);
  filter.connect(gain);
  gain.connect(AUDIO.dryGain);
  gain.connect(AUDIO.reverb);

  osc.start(); osc2.start();
  gain.gain.setTargetAtTime(vol, ctx.currentTime, 2.4);

  AUDIO.nodes.push({ osc, gain, lfo: trem });
  AUDIO.nodes.push({ osc: osc2, gain, lfo: vib });
  return { osc, osc2, gain };
}

// ── Harp-style pluck — the melodic/phrase layer ───────────────────────────
function harpPluck(hz, vol=0.10, decay=1.6) {
  const ctx = AUDIO.ctx;
  const now = ctx.currentTime;

  // Two partials: fundamental + octave for harp character
  [1, 2].forEach((partial, i) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    const filt = ctx.createBiquadFilter();

    osc.type = i === 0 ? 'triangle' : 'sine';
    osc.frequency.value = hz * partial;
    // Pluck pitch envelope — slight downward bend at attack
    osc.frequency.setTargetAtTime(hz * partial * 0.997, now + 0.01, 0.08);

    filt.type = 'lowpass';
    filt.frequency.value = 3000 - i * 800;
    filt.Q.value = 1.5;

    // Harp envelope: fast attack, slow exponential decay
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol * (i === 0 ? 1 : 0.35), now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + decay * (i === 0 ? 1 : 0.6));

    osc.connect(filt); filt.connect(gain);
    gain.connect(AUDIO.dryGain);
    gain.connect(AUDIO.reverb);
    if (i === 0) gain.connect(AUDIO.reverb2);

    osc.start(now);
    osc.stop(now + decay + 0.1);
  });
}

// ── Bell / chime layer — crystalline high notes ───────────────────────────
function bellChime(hz, vol=0.06, decay=3.0) {
  const ctx = AUDIO.ctx;
  const now = ctx.currentTime;

  // Bell partials: inharmonic series (real bells aren't perfectly harmonic)
  const partials = [1, 2.756, 5.404, 8.933];
  const vols     = [1, 0.45,  0.20,  0.08 ];

  partials.forEach((ratio, i) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = hz * ratio;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol * vols[i], now + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + decay * (1 - i * 0.18));

    osc.connect(gain);
    gain.connect(AUDIO.reverb);
    gain.connect(AUDIO.reverbGain); // extra wash

    osc.start(now);
    osc.stop(now + decay + 0.2);
  });
}

// ── Arpeggio chord pulse layer ────────────────────────────────────────────
function arpChord(notes_hz, vol=0.065, stepMs=140) {
  notes_hz.forEach((hz, i) => {
    setTimeout(() => {
      if (!AUDIO.enabled) return;
      harpPluck(hz, vol * (i === 0 ? 1.2 : 0.8), 1.2);
    }, i * stepMs);
  });
}

// ── Bass pulse (boss scenes) ───────────────────────────────────────────────
function bassPulse(hz, vol=0.18) {
  const ctx = AUDIO.ctx;
  const now = ctx.currentTime;
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  const filt = ctx.createBiquadFilter();

  osc.type = 'sawtooth';
  osc.frequency.value = hz;

  filt.type = 'lowpass';
  filt.frequency.value = 280;
  filt.Q.value = 2.5;

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

  osc.connect(filt); filt.connect(gain);
  gain.connect(AUDIO.dryGain);

  osc.start(now);
  osc.stop(now + 0.4);
}

// ── Noise atmosphere ───────────────────────────────────────────────────────
function makeNoise(vol=0.012, filterHz=400) {
  const ctx = AUDIO.ctx;
  const bufLen = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;

  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = filterHz;
  filter.Q.value = 0.25;

  const gain = ctx.createGain();
  gain.gain.value = 0;
  src.connect(filter); filter.connect(gain);
  gain.connect(AUDIO.reverb);
  src.start();
  gain.gain.setTargetAtTime(vol, ctx.currentTime, 3.0);

  AUDIO.nodes.push({ osc: src, gain });
}

// ══════════════════════════════════════════════════════
// MUSICAL PHRASE ENGINE
// Plays structured motifs with swing, dynamics, rests
// ══════════════════════════════════════════════════════
let _seqConfig  = null;
let _motifQueue = [];    // upcoming note offsets for current motif
let _motifIdx   = 0;     // which motif we're on
let _phrasePos  = 0;     // position within current phrase
let _beatCount  = 0;     // global beat counter for chord sync

function _pickMotif(scaleName) {
  const motifs = MOTIFS[scaleName] || MOTIFS.dorian;
  // Occasionally repeat the same motif for development
  if (_beatCount > 0 && Math.random() < 0.3) return _motifQueue;
  _motifIdx = Math.floor(Math.random() * motifs.length);
  return [...motifs[_motifIdx]];
}

function scheduleNextNote() {
  if (!AUDIO.enabled || !_seqConfig) return;

  const { scale, droneRoot, bpm, swing, layers } = _seqConfig;
  const scaleNotes = SCALES[scale] || SCALES.dorian;
  const beatMs = (60000 / bpm);
  // Swing: alternate beats are slightly delayed
  const swingOffset = (_beatCount % 2 === 1) ? beatMs * (swing - 0.5) * 0.5 : 0;

  // Fill phrase queue if empty
  if (_motifQueue.length === 0) {
    _motifQueue = _pickMotif(scale);
    _phrasePos  = 0;

    // Every 2 phrases, fire a chord arpeggio
    if (layers.includes('arp') && _beatCount % 8 === 0 && _beatCount > 0) {
      const chordDefs = CHORDS[scale] || CHORDS.dorian;
      const chord = chordDefs[Math.floor(Math.random() * chordDefs.length)];
      const baseIdx = 3; // mid-register
      const chordHz = chord.map(deg => midiToHz(scaleNotes[Math.min(deg + baseIdx, scaleNotes.length - 1)]));
      arpChord(chordHz, 0.058, 160);
    }

    // Bell accent every 4 phrases
    if (layers.includes('bell') && _beatCount % 16 === 0 && _beatCount > 0) {
      const bellIdx = 8 + Math.floor(Math.random() * 4);
      bellChime(midiToHz(scaleNotes[Math.min(bellIdx, scaleNotes.length - 1)]), 0.055, 3.5);
    }
  }

  // Get next scale-degree offset from motif
  const step = _motifQueue.shift();
  _phrasePos += step;
  // Keep phrase position within a comfortable melodic range (indices 3–11)
  _phrasePos = Math.max(2, Math.min(_phrasePos, 11));
  _beatCount++;

  const hz = midiToHz(scaleNotes[_phrasePos] || scaleNotes[5]);

  // Dynamic variation: louder on phrase starts, quieter mid-phrase
  const phrasePos = _motifIdx % 3;
  const vol = 0.065 + (phrasePos === 0 ? 0.03 : 0) + Math.random() * 0.025;

  // 25% chance of rest for breathing room
  if (Math.random() > 0.25 && layers.includes('harp')) {
    harpPluck(hz, vol, 1.4 + Math.random() * 0.8);
  }

  // Boss scene: bass pulse on strong beats
  if (layers.includes('pulse') && _beatCount % 2 === 0) {
    bassPulse(midiToHz(droneRoot), 0.16);
  }

  const jitter = (Math.random() - 0.5) * beatMs * 0.06; // tighter jitter = more rhythmic
  AUDIO.seqTimer = setTimeout(scheduleNextNote, beatMs + swingOffset + jitter);
}

// ── Start music for a given scene key ─────────────────────────────────────
function audioPlayScene(sceneKey) {
  if (!AUDIO.enabled) return;
  if (!AUDIO.started) audioInit();
  if (!AUDIO.ctx) return;

  const key = SCENE_MUSIC[sceneKey] ? sceneKey : 'archive';
  if (AUDIO.currentScene === key) return;
  AUDIO.currentScene = key;

  const cfg = SCENE_MUSIC[key];

  audioFadeOutAll(() => {
    if (!AUDIO.enabled) return;
    _seqConfig  = cfg;
    _motifQueue = [];
    _phrasePos  = 5;
    _beatCount  = 0;

    AUDIO.reverbGain.gain.setTargetAtTime(cfg.reverbMix, AUDIO.ctx.currentTime, 1.2);
    AUDIO.reverb2Gain.gain.setTargetAtTime(cfg.reverbMix * 0.4, AUDIO.ctx.currentTime, 1.2);
    AUDIO.dryGain.gain.setTargetAtTime(1 - cfg.reverbMix * 0.35, AUDIO.ctx.currentTime, 1.2);
    AUDIO.master.gain.setTargetAtTime(cfg.masterVol, AUDIO.ctx.currentTime, 2.2);

    const scaleNotes = SCALES[cfg.scale] || SCALES.dorian;

    // Pad drones — rich sustained tones on root intervals
    cfg.droneIntervals.forEach((semitones, i) => {
      const hz   = midiToHz(cfg.droneRoot + semitones);
      const vol  = i === 0 ? 0.13 : i === 1 ? 0.08 : 0.05;
      const wave = i === 0 ? 'sine' : 'triangle';
      makePad(hz, vol * (1 - cfg.reverbMix * 0.2), wave);
    });

    // Sub-bass root — very quiet foundation
    makePad(midiToHz(cfg.droneRoot - 12), 0.045, 'sine');

    // Noise atmosphere
    makeNoise(0.012, cfg.filterFreq * 0.25);

    // Opening bell accent to signal scene change
    if (cfg.layers.includes('bell')) {
      const openNote = scaleNotes[7] || scaleNotes[5];
      bellChime(midiToHz(openNote), 0.07, 4.0);
    }

    // Opening arp if scene uses it
    if (cfg.layers.includes('arp')) {
      const chordDefs = CHORDS[cfg.scale] || CHORDS.dorian;
      const chord = chordDefs[0];
      const baseIdx = 3;
      const chordHz = chord.map(d => midiToHz(scaleNotes[Math.min(d + baseIdx, scaleNotes.length - 1)]));
      setTimeout(() => { if (AUDIO.enabled) arpChord(chordHz, 0.06, 150); }, 1200);
    }

    // Start phrase sequencer — slight delay so drones establish first
    clearTimeout(AUDIO.seqTimer);
    const firstDelay = (60000 / cfg.bpm) * (1.5 + Math.random());
    AUDIO.seqTimer = setTimeout(scheduleNextNote, firstDelay);
  });
}

function audioFadeOutAll(cb) {
  clearTimeout(AUDIO.seqTimer);
  if (!AUDIO.ctx) { if (cb) cb(); return; }

  AUDIO.master.gain.setTargetAtTime(0, AUDIO.ctx.currentTime, 0.7);

  const toStop = [...AUDIO.nodes];
  AUDIO.nodes = [];
  setTimeout(() => {
    toStop.forEach(n => {
      try { n.osc.stop(); } catch(e) {}
      try { n.lfo && n.lfo.stop(); } catch(e) {}
    });
    if (cb) cb();
  }, 2000);
}

// ── Toggle music on/off ────────────────────────────────────────────────────
function toggleMusic() {
  if (!AUDIO.started) audioInit();

  AUDIO.enabled = !AUDIO.enabled;
  const btn = document.getElementById('hud-music-btn');

  if (AUDIO.enabled) {
    btn.textContent = '🎵 Music';
    btn.classList.add('save-on');
    // Resume context if suspended (browser autoplay policy)
    if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') {
      AUDIO.ctx.resume();
    }
    // Play current scene
    const scene = AUDIO.currentScene || 'map';
    AUDIO.currentScene = null; // force restart
    audioPlayScene(scene);
    showTooltip('Ambient music on — volume in your browser controls.');
  } else {
    btn.textContent = '🎵 Off';
    btn.classList.remove('save-on');
    AUDIO.currentScene = null;
    audioFadeOutAll();
    showTooltip('Ambient music off.');
  }
}

// ── Hook into scene/map transitions ───────────────────────────────────────
// Called by vnSetBackground and showMap
function audioSceneChange(key) {
  if (AUDIO.enabled) audioPlayScene(key);
}

  const tip = document.getElementById('save-tooltip');
  if (!tip) return;
  tip.textContent = msg;
  tip.classList.add('show');
  clearTimeout(tip._timer);
  tip._timer = setTimeout(() => tip.classList.remove('show'), 3000);
}

// LOCALSTORAGE SAVE / RESTORE
// ══════════════════════════════════════════════════════
function saveProgress() {
  if (!G.class) return;
  try {
    localStorage.setItem('otsp_save', JSON.stringify({
      class: G.class, hp: G.hp, maxHp: G.maxHp,
      xp: G.xp, level: G.level, questsDone: G.questsDone
    }));
  } catch(e) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem('otsp_save');
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s.class || !CLASSES[s.class]) return false;
    G.class = s.class; G.hp = s.hp; G.maxHp = s.maxHp;
    G.xp = s.xp; G.level = s.level; G.questsDone = s.questsDone || [];
    return true;
  } catch(e) { return false; }
}

function clearProgress() {
  try { localStorage.removeItem('otsp_save'); } catch(e) {}
  G.class = null; G.hp = 0; G.maxHp = 0; G.xp = 0; G.level = 1; G.questsDone = [];
  updateHUD();
  showTitle();
}

      <p style="font-size:0.9rem; color:var(--text-dim); margin-bottom:1.5rem">Level ${G.level} · ${G.xp} XP · ${G.questsDone.length} quest${G.questsDone.length !== 1 ? 's' : ''} completed</p>
      <div style="display:flex; gap:12px; flex-wrap:wrap">
        <button class="btn btn-primary" onclick="if(!AUDIO.started){audioInit();} showMap()">Continue ›</button>
        <button class="btn btn-ghost" onclick="clearProgress()">Start Over</button>
      </div>
    </div>`;
} else {
  showTitle();
}
</script>
</body>
</html>
